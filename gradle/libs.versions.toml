[versions]
kotlin = "2.4.10"
gradleVersions = "0.61.0"
buildConfig = "6.0.10"
junit = "4.13.2"
jackson = "2.22.2"
netty = "4.2.17.Final"
log4j = "2.26.1"
slf4j = "2.0.19"
coroutines = "1.11.0"
kwery = "0.17"
mariadb = "3.5.10"
reflections = "0.11.7"
commonsLang = "3.20.0"
jasypt = "1.9.3"
mbassador = "1.3.2"
bouncycastle = "1.85.2"
hikari = "7.1.0"
commonsCodec = "1.22.1"
nashorn = "15.7"
javalin = "7.2.3"
jbcrypt = "0.4"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
netty-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j = { module = "org.apache.logging.log4j:log4j-slf4j-impl", version.ref = "log4j" }
log4j-slf4j2 = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
kwery-core = { module = "com.github.andrewoma.kwery:core", version.ref = "kwery" }
mariadb-driver = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
reflections = { module = "net.oneandone.reflections8:reflections8", version.ref = "reflections" }
commons-lang = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang" }
jasypt = { module = "org.jasypt:jasypt", version.ref = "jasypt" }
mbassador = { module = "net.engio:mbassador", version.ref = "mbassador" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
nashorn = { module = "org.openjdk.nashorn:nashorn-core", version.ref = "nashorn" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ben-manes-versions = { module = "io.github.ben-manes:gradle-versions-plugin", version.ref = "gradleVersions" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildConfig" }
dependency-updates = { id = "io.github.ben-manes.versions", version.ref = "gradleVersions" }
