def mDestinationDirectory = file("$rootDir/plugins")
def libDirName = "lib/$project.name"

// 1. Cria uma FileCollection nativa e preguiçosa (lazy)
// Evita o uso de Java Streams e não resolve as dependências antes da hora.
// Filtra apenas o JAR do projeto :server, não dependências que contenham "server" no nome
def pluginLibs = configurations.runtimeClasspath
        .minus(project(":server").configurations.runtimeClasspath)
        .filter { !it.name.startsWith("server-") }

processResources {
    filesMatching(["**/*.properties", "**/*.json", "**/*.yml", "**/*.yaml"]) {
        expand(project_name: project.name, version: project.version.toString())
    }
}

dependencies {
    compileOnly project(":server")
}

// 2. Simplificando a limpeza usando a task 'clean' padrão
clean {
    delete jar.archiveFile
    delete file("$mDestinationDirectory/$libDirName")
}

tasks.register('copyLibs', Copy) {
    from pluginLibs
    into file("$mDestinationDirectory/$libDirName")
}

jar {
    destinationDirectory.set(mDestinationDirectory)
    dependsOn copyLibs

    // 3. Usa provider { ... } para garantir que o Class-Path só seja
    // calculado no momento exato de montar o JAR, otimizando o build.
    manifest {
        attributes 'Class-Path': provider {
            pluginLibs.collect { "$libDirName/${it.name}" }.join(' ')
        }
    }
}